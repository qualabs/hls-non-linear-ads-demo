<?xml version="1.0" encoding="UTF-8"?>
<!--
  THE STATE OF THE MATCH, and this is the one graphic that carries the story
  rather than the branding.

  It is on screen ONLY while play is stopped, burned over that stretch of the
  plate and nowhere else. What it buys is that the minute is legible with the
  sound off and with nobody explaining it: a viewer who sees "COOLING BREAK ·
  PLAY STOPPED" knows the game has not been cut away from, which is the exact
  thing this demo argues. Without it, sixty seconds of players standing around
  looks like a slow passage of play.

  Real broadcasts show this. It is invented here like everything else in the
  package, and it imitates nobody's dress.

  Rasterised with Chrome headless for real alpha at exactly 1280x720 (ADR 0045).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Under the scorebug and aligned to it, which is where a broadcast hangs a
       state strip. Narrower than the bug above it, so the two read as one
       group and not as two graphics. -->
  <g opacity="0.94">
    <rect x="40" y="86" width="330" height="30" rx="6" fill="#0e1116" fill-opacity="0.88"/>
    <rect x="40" y="86" width="4" height="30" fill="#f0a24b"/>
    <text x="58" y="106" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13"
          font-weight="bold" letter-spacing="1.4" fill="#f0a24b">COOLING BREAK</text>
    <!-- The separator, and the two x positions on either side of it, are set from
         the width the type actually takes: 13 characters of bold 13px DejaVu with
         1.4 of tracking run about 123px, so the second label cannot start at 176
         and the plate cannot be 232 wide. Measured by looking at the burned
         frame, not computed: the first version had the two labels overlapping
         and the second one hanging off the right edge of its own plate.

         Worth the comment because the lesson is not about these numbers. The
         annex says the GENERATOR deforms small type; this was hand-written SVG
         and still came out wrong. Type over a shape gets looked at, whoever
         wrote it. -->
    <line x1="196" y1="92" x2="196" y2="110" stroke="#2b323d" stroke-width="1.5"/>
    <text x="212" y="106" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13"
          letter-spacing="1.2" fill="#8b97ab">PLAY STOPPED</text>
  </g>
</svg>
