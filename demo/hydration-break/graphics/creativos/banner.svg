<?xml version="1.0" encoding="UTF-8"?>
<!-- MERIDIA, el banner inferior. 1280x216 = la caja `70 0 0 0` sobre 1280x720, que son
     5,93 a 1. La tipografía vive en el tercio izquierdo y el resto se deja al fondo
     generado, porque una franja de esta forma no tiene lugar para dos cosas.

     NADA BAJA DE y=170, y eso es una restricción y no una elección de composición: la
     barra de progreso que dibuja la librería ocupa los últimos ~44 px de la imagen, y
     esta caja llega al borde inferior. Medido mirando la pantalla: el botón de la
     primera versión estaba a y=158 y la barra le pasaba por encima. El cromo se
     esconde solo, así que en una grabación limpia no está — pero un creativo que sólo
     se lee cuando el cromo está abajo es un creativo que a veces no se lee. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="216" viewBox="0 0 1280 216">
  <defs>
    <linearGradient id="velo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#0b1216" stop-opacity="0.94"/>
      <stop offset="0.42" stop-color="#0b1216" stop-opacity="0.80"/>
      <stop offset="0.78" stop-color="#0b1216" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="216" fill="url(#velo)"/>
  <rect x="0" y="0" width="6" height="216" fill="#e8b04b"/>
  <text x="46" y="64" font-family="Lato, DejaVu Sans, sans-serif" font-size="52"
        font-weight="700" letter-spacing="7" fill="#f6f8f9">MERIDIA</text>
  <text x="49" y="100" font-family="Lato, DejaVu Sans, sans-serif" font-size="19"
        letter-spacing="4.5" fill="#e8b04b">SOMEWHERE ELSE, THIS WEEK</text>
  <g transform="translate(46,118)">
    <rect x="0" y="0" width="188" height="38" rx="19" fill="none" stroke="#f6f8f9"
          stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="94" y="25" text-anchor="middle" font-family="Lato, DejaVu Sans, sans-serif"
          font-size="15" letter-spacing="2.4" fill="#f6f8f9">SEE THE FARES</text>
  </g>
</svg>
