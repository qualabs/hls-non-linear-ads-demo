<?xml version="1.0" encoding="UTF-8"?>
<!--
  EL PAQUETE DE CANAL, partido en tres piezas porque el grafico CAMBIA cuando entra la
  parada.

  POR QUE CAMBIA, y la razon importa mas que la implementacion: **porque el estado del
  partido cambio**, y el grafico es como una transmision dice eso. En ese minuto no hay
  nada que tantear. **No mitiga una discontinuidad: no hay discontinuidad.** La parada
  sale generada desde el cuadro de juego, asi que la imagen muestra a los jugadores
  dejando de jugar y yendo a tomar agua.

  Vale escrito asi porque una razon equivocada sobrevive mejor que un error: si aca
  dijera "el grafico disimula el corte", el dia que alguien mire y vea que no hay corte
  lo sacaria, con toda la logica del mundo.

    bug-de-canal.svg     siempre, es el canal
    scorebug.svg         solo durante el juego: los dos clubes y el marcador
    hydration-break.svg  solo durante la parada, y ocupa el lugar del scorebug

  EL RELOJ SE QUEDA EN LAS DOS, y la razon es de futbol: en una parada de hidratacion el
  partido no esta detenido reglamentariamente y el reloj no se para. Un reloj que sigue
  corriendo mientras el tanteador se va dice exactamente "el partido no se detuvo, la
  transmision cambio de grafico", que es la propiedad que esta demo existe para mostrar,
  dicha con graficos. Por eso las dos piezas dejan el hueco del reloj en las MISMAS
  coordenadas: la placa cambia por debajo y los digitos no se mueven.

  Todo inventado: el canal, los dos clubes, el marcador. Y es SVG y no imagen generada
  porque la generacion no da alfa ni dimensiones exactas (ADR 0045).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- OCUPA EL LUGAR DEL SCOREBUG, con el mismo alto y el mismo borde izquierdo, para
       que el cambio se lea como un cambio de grafico del mismo canal. -->
  <rect x="40" y="34" width="286" height="46" rx="8" fill="#0e1116" fill-opacity="0.92"/>
  <rect x="40" y="34" width="7" height="46" fill="#f0a24b"/>
  <!-- El texto tiene que terminar antes de x=146, que es donde arranca el hueco del
       reloj. Medido al reves primero: a font-size 15 con 1,5 de tracking, "HYDRATION"
       llega a 172 y se le mete adentro; a 12,5 la N lo besa. -->
  <text x="60" y="55" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5"
        font-weight="bold" letter-spacing="0.6" fill="#f0a24b">HYDRATION</text>
  <text x="60" y="73" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5"
        font-weight="bold" letter-spacing="0.6" fill="#f0a24b">BREAK</text>

  <!-- El mismo hueco del reloj, en las mismas coordenadas que en scorebug.svg. -->
  <rect x="146" y="34" width="180" height="46" fill="#181d25" fill-opacity="0.92"/>
  <line x1="146" y1="34" x2="146" y2="80" stroke="#2b323d" stroke-width="1.5"/>
</svg>
