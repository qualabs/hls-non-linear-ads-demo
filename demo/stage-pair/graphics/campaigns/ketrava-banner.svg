<?xml version="1.0" encoding="UTF-8"?>
<!--
  KETRAVA — la forma BANNER, 1680 x 189 (8,889:1). Es la misma campaña que
  ketrava-16x9.svg autorada para otra caja (ADR 0081).

  EL OBJETO NO ES UNO PARECIDO: ES EL MISMO. El bloque del faro está copiado
  literalmente del archivo 16:9, entre sus marcas INICIO OBJETO y FIN OBJETO, y
  lo único que cambia acá es el `transform` que lo reencuadra, a 0,44. El haz
  viene con él: 880 px por 0,44 son 387, que es lo que hace que la luz cruce un
  tercio de la barra y el faro no quede con una lamparita al lado.

  LO QUE NO SE COPIA ES EL MAR, y es a propósito. Los planos de mar del 16:9
  están dibujados contra un cuadro de 1080 px de alto; acá hay 189, así que sus
  amplitudes de 12, 20 y 34 px se comerían la barra entera. El mar se rehace
  con DOS planos en vez de tres y con amplitudes de 5 y 9 px. Lo que se
  conserva es la regla, que es lo que define la campaña: cada plano se desplaza
  EXACTAMENTE un período de su propia onda en 3 s, y los períodos SON las
  velocidades. Tres planos y dos planos son la misma idea a dos escalas; copiar
  los números habría sido lo contrario.

  POR QUÉ LA BARRA ES OPACA Y OCUPA EL RECTÁNGULO ENTERO. El archivo no tiene
  un solo píxel transparente: la barra llena los 1680 x 189 y las esquinas son
  vivas. La razón es el ADR 0084: entre la variante rica de este banner (video)
  y la magra (imagen) cambia UNA sola cosa, y H.264 no transporta alfa, así que
  todo lo que acá fuera transparente saldría NEGRO en el video y las dos
  variantes dejarían de ser la misma pieza. El texto además se lee mejor sobre
  fondo opaco; lo único que se pierde es ver un poco del programa detrás, que
  era un efecto y no un requisito.

  EL BUCLE NO TIENE MOMENTO FEO: el mar cierra en 3 s y el haz barre y vuelve en
  6 s con el mismo valor en 0 y en 1, que es lo que el adelanto de 3,25 s medido
  en la T-02 obliga.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="189"
     viewBox="0 0 1680 189" role="img" aria-label="KETRAVA — The slow coast.">

  <style>
    .t { font-family: 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif; }
    .b { font-weight: 700; }
  </style>

  <defs>

    <linearGradient id="fondo" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0"    stop-color="#071822"/>
      <stop offset="0.55" stop-color="#051119"/>
      <stop offset="1"    stop-color="#03080d"/>
    </linearGradient>

    <!-- El resplandor del horizonte: el sol ya se fue, queda el calor. -->
    <radialGradient id="horizonte" cx="0.5" cy="1" r="0.75">
      <stop offset="0"    stop-color="#ffcf8a" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#ff9e6a" stop-opacity="0.10"/>
      <stop offset="1"    stop-color="#ffcf8a" stop-opacity="0"/>
    </radialGradient>

    <!-- El desvanecido de la escena. Fuera del rango el gradiente repite su
         último stop, así que a la derecha de 1180 queda blanco entero. -->
    <linearGradient id="desvanece" gradientUnits="userSpaceOnUse"
                    x1="470" y1="0" x2="1180" y2="0">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <mask id="escena">
      <rect x="0" y="0" width="1920" height="1080" fill="url(#desvanece)"/>
    </mask>

    <linearGradient id="marLejos" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14525c"/>
      <stop offset="1" stop-color="#0e3a44"/>
    </linearGradient>
    <linearGradient id="marMedio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d6f74"/>
      <stop offset="1" stop-color="#103a44"/>
    </linearGradient>
    <linearGradient id="marCerca" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e8f8a"/>
      <stop offset="1" stop-color="#0b2b36"/>
    </linearGradient>

    <linearGradient id="cabo" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0f3341"/>
      <stop offset="1" stop-color="#061620"/>
    </linearGradient>

    <linearGradient id="torre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#8fa6ad"/>
      <stop offset="0.35" stop-color="#eef6f7"/>
      <stop offset="0.75" stop-color="#b9cbcf"/>
      <stop offset="1"    stop-color="#6d8188"/>
    </linearGradient>

    <linearGradient id="haz" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="-880" y2="0">
      <stop offset="0"    stop-color="#ffcf8a" stop-opacity="0.34"/>
      <stop offset="0.45" stop-color="#ffcf8a" stop-opacity="0.12"/>
      <stop offset="1"    stop-color="#ffcf8a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hazCorto" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0">
      <stop offset="0" stop-color="#ffcf8a" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="lampara" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#fff3de" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffcf8a" stop-opacity="0.55"/>
      <stop offset="1"    stop-color="#ffcf8a" stop-opacity="0"/>
    </radialGradient>
  

    <!-- La barra: el rectángulo entero, opaco y sin esquinas redondeadas. -->
    <clipPath id="barra">
      <rect x="0" y="0" width="1680" height="189"/>
    </clipPath>
  </defs>

  <g clip-path="url(#barra)">
    <rect x="0" y="0" width="1680" height="189" fill="url(#fondo)"/>
    <rect x="0" y="0" width="12" height="189" fill="#ffcf8a"/>

    <ellipse cx="1360" cy="176" rx="420" ry="150" fill="url(#horizonte)"/>

    <!-- ===================== tipografía ===================== -->
    <text class="t b" x="56" y="94" font-size="56" letter-spacing="6"
          fill="#eef6f7">KETRAVA</text>
    <text class="t" x="58" y="136" font-size="24" letter-spacing="8"
          fill="#ffcf8a">THE SLOW COAST</text>

    <rect x="620" y="44" width="2" height="102" fill="#ffcf8a" opacity="0.28"/>

    <text class="t" x="672" y="88" font-size="32" letter-spacing="0.5"
          fill="#c3d3d6">Island routes, small boats.</text>
    <text class="t" x="672" y="134" font-size="19" letter-spacing="4"
          fill="#7d949b">DEPARTURES FROM NINE PORTS</text>

    <!-- ===================== el mar, plano de atrás ===================== -->
    <!-- período 160, amplitud 5 -->
    <g>
      <animateTransform attributeName="transform" attributeType="XML" type="translate"
                        values="0,0; -160,0" dur="3s" repeatCount="indefinite"/>
      <path fill="url(#marLejos)"
            d="M-160,150
               q40,-5 80,0 q40,5 80,0 q40,-5 80,0 q40,5 80,0 q40,-5 80,0 q40,5 80,0 q40,-5 80,0 q40,5 80,0
               q40,-5 80,0 q40,5 80,0 q40,-5 80,0 q40,5 80,0 q40,-5 80,0 q40,5 80,0 q40,-5 80,0 q40,5 80,0
               q40,-5 80,0 q40,5 80,0 q40,-5 80,0 q40,5 80,0 q40,-5 80,0 q40,5 80,0 q40,-5 80,0 q40,5 80,0
               q40,-5 80,0 q40,5 80,0 q40,-5 80,0 q40,5 80,0
               L2080,189 L-160,189 Z"/>
    </g>

    <!-- el cabo, apoyado sobre el mar lejano -->
    <path fill="url(#cabo)"
          d="M1300,162 C1360,152 1420,140 1470,132 C1520,124 1600,120 1680,114
             L1680,189 L1300,189 Z"/>

    <!-- ===================== el objeto ===================== -->
    <!-- El faro del 16:9, a 0,44: 320 px de torre por 0,44 son 141. -->
    <g transform="translate(726,-134) scale(0.44)">

    <g transform="translate(1690,0)">
      <!-- el fuste: troncocónico, 62 de base y 38 de cuello -->
      <path fill="url(#torre)" d="M-33,646 L-19,424 L19,424 L33,646 Z"/>
      <!-- las bandas: lo que hace que una torre blanca sea un faro -->
      <path fill="#ffcf8a" opacity="0.85" d="M-26.6,536 L26.6,536 L28.4,562 L-28.4,562 Z"/>
      <path fill="#ffcf8a" opacity="0.85" d="M-21.6,464 L21.6,464 L23.4,490 L-23.4,490 Z"/>
      <!-- la galería: VUELA por fuera del fuste, y sin eso es un poste -->
      <rect x="-34" y="410" width="68" height="14" fill="#c8d8dc"/>
      <g stroke="#8fa6ad" stroke-width="2.5" opacity="0.9">
        <path d="M-30,410 L-30,392"/>
        <path d="M-15,410 L-15,392"/>
        <path d="M0,410 L0,392"/>
        <path d="M15,410 L15,392"/>
        <path d="M30,410 L30,392"/>
        <path d="M-32,394 L32,394"/>
      </g>
      <!-- la linterna, más angosta que la galería -->
      <rect x="-22" y="366" width="44" height="44" fill="#173a44"/>
      <rect x="-22" y="366" width="44" height="44" fill="#ffcf8a" opacity="0.28"/>
      <!-- el techo -->
      <path fill="#c8d8dc" d="M-26,366 L0,336 L26,366 Z"/>
      <circle cx="0" cy="330" r="4" fill="#c8d8dc"/>

      <!-- el haz: dos conos, un pivote, un barrido de 6 s que cierra igual -->
      <g transform="translate(0,388)">
        <animateTransform attributeName="transform" attributeType="XML" type="rotate"
                          values="-16;16;-16" keyTimes="0;0.5;1"
                          dur="6s" repeatCount="indefinite" additive="sum"/>
        <path fill="url(#haz)"      d="M0,0 L-880,-118 L-880,118 Z"/>
        <path fill="url(#hazCorto)" d="M0,0 L300,-44 L300,44 Z"/>
      </g>
      <!-- la lámpara, encima del haz para que la fuente sea el punto más claro -->
      <ellipse cx="0" cy="388" rx="46" ry="34" fill="url(#lampara)"/>
    </g>
    </g>

    <!-- el barco, redibujado a escala de barra: a 0,44 el del 16:9 mediría
         34 px y no se leería como un barco sino como una mancha -->
    <g transform="translate(1120,158)">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate"
                        values="-4;4;-4" keyTimes="0;0.5;1"
                        dur="3s" repeatCount="indefinite" additive="sum"/>
      <animateTransform attributeName="transform" attributeType="XML" type="translate"
                        values="0,2; 0,-3; 0,2" keyTimes="0;0.5;1"
                        dur="3s" repeatCount="indefinite" additive="sum"/>
      <path fill="#ffcf8a" opacity="0.95" d="M-7,-30 L-6,-3 L-22,-3 Z"/>
      <path fill="#eef6f7" opacity="0.8"  d="M-3,-29 L12,-4 L-2,-4 Z"/>
      <rect x="-7.5" y="-32" width="1.6" height="29" fill="#eef6f7" opacity="0.75"/>
      <path fill="#0b2b36" d="M-25,-3 L19,-3 C15,7 -12,8 -25,-3 Z"/>
      <path fill="#2e8f8a" opacity="0.9" d="M-25,-3 L19,-3 L18,0 L-24,0 Z"/>
    </g>

    <!-- ===================== el mar, plano de adelante ===================== -->
    <!-- período 260, amplitud 9: recorre más en el mismo tiempo, y eso es el
         paralaje -->
    <g>
      <animateTransform attributeName="transform" attributeType="XML" type="translate"
                        values="0,0; -260,0" dur="3s" repeatCount="indefinite"/>
      <path fill="url(#marCerca)"
            d="M-260,166
               q65,-9 130,0 q65,9 130,0 q65,-9 130,0 q65,9 130,0 q65,-9 130,0 q65,9 130,0 q65,-9 130,0 q65,9 130,0
               q65,-9 130,0 q65,9 130,0 q65,-9 130,0 q65,9 130,0 q65,-9 130,0 q65,9 130,0 q65,-9 130,0 q65,9 130,0
               q65,-9 130,0 q65,9 130,0
               L2080,189 L-260,189 Z"/>
      <path fill="#7fe3d6" opacity="0.3"
            d="M-260,166
               q65,-9 130,0 q65,9 130,0 q65,-9 130,0 q65,9 130,0 q65,-9 130,0 q65,9 130,0 q65,-9 130,0 q65,9 130,0
               q65,-9 130,0 q65,9 130,0 q65,-9 130,0 q65,9 130,0 q65,-9 130,0 q65,9 130,0 q65,-9 130,0 q65,9 130,0
               q65,-9 130,0 q65,9 130,0
               L2080,170
               q-65,9 -130,0 q-65,-9 -130,0 q-65,9 -130,0 q-65,-9 -130,0 q-65,9 -130,0 q-65,-9 -130,0 q-65,9 -130,0 q-65,-9 -130,0 q-65,9 -130,0 q-65,-9 -130,0 q-65,9 -130,0 q-65,-9 -130,0 q-65,9 -130,0 q-65,-9 -130,0 q-65,9 -130,0 q-65,-9 -130,0
               q-65,9 -130,0 q-65,-9 -130,0 q-65,9 -130,0 q-65,-9 -130,0 q-65,9 -130,0 q-65,-9 -130,0 q-65,9 -130,0 q-65,-9 -130,0 q-65,9 -130,0 q-65,-9 -130,0 q-65,9 -130,0 q-65,-9 -130,0 q-65,9 -130,0 q-65,-9 -130,0 q-65,9 -130,0 q-65,-9 -130,0
               q-65,9 -130,0 q-65,-9 -130,0
               Z"/>
    </g>

    <rect x="0" y="0" width="1680" height="3" fill="#ffcf8a" opacity="0.55"/>
  </g>
</svg>
