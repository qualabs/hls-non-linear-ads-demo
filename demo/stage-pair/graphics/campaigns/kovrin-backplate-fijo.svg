<?xml version="1.0" encoding="UTF-8"?>
<!-- GENERADO por scripts/congelar-svg.py desde kovrin-backplate.svg, cuadro t=1.5 s. No se edita: se edita el original y se vuelve a correr. Es la variante de imagen del aviso (fase 15) y no tiene ninguna animación. -->
<!--
  KOVRIN — la forma BACKPLATE, 1920 x 1080. Es la misma campaña que
  kovrin-16x9.svg autorada para otra caja (ADR 0081).

  QUÉ ES ESTA FORMA. El layout es `squeezebackLShape` (ADR 0047): el aviso es UN
  solo elemento a cuadro entero, en zDepth 0, y el contenido primario va ENCIMA,
  encogido y anclado contra dos bordes. Este archivo mide 1920 x 1080 pero NO se
  ve entero: la película tapa una parte y lo que queda a la vista es una L.

  LA GUARDA, QUE ES EL NÚMERO QUE GOBIERNA ESTE ARCHIVO. La T-01 eligió los dos
  bordes —arriba y derecha— y el inset —25 % en los dos ejes, que mantiene el
  16:9 del primario en 1440 x 810—. De ahí sale, en coordenadas de este viewBox:

  · la guarda, que el primario tapa      x 480, y 0, ancho 1440, alto 810
  · lo que se ve, y es la L              la columna izquierda x 0..480 a alto
                                         entero, y la banda inferior y 810..1080
                                         a ancho entero

  TODO EL DIBUJO ESTÁ RECORTADO A LA L, con un `clipPath` de dos rectángulos.
  Dos hijos de un `clipPath` se UNEN, y acá unir es exactamente lo que se
  quiere: la unión de la columna y la banda ES la L. Que el recorte sea una
  guarda de construcción y no un cuidado al dibujar es lo que hace que la región
  de la guarda quede en alfa cero aunque alguien agregue un elemento después.

  DÓNDE VA EL ZAPATO, Y POR QUÉ NO EN LA COLUMNA. Es la única de las tres
  campañas cuyo objeto es horizontal: el zapato mide 694 x 240 y la columna mide
  480 de ancho. Metido ahí habría que girarlo o achicarlo hasta que no se lea.
  Va en la banda inferior, que mide 1920 x 270 y es la caja que un zapato de
  perfil pide, la misma razón por la que esta campaña se lleva el banner.

  Y ENTONCES LA COLUMNA LLEVA EL MOVIMIENTO. El patrón de tacos, que en el 16:9
  y en el banner corre en horizontal, acá baja por la columna: el mismo dibujo
  girado 90°, el mismo período de 90 px, el mismo ciclo de 3 s. La columna deja
  de ser un fondo vacío y la campaña sigue diciendo lo mismo, que lo que se
  mueve es el suelo.

  EL OBJETO NO ES UNO PARECIDO: ES EL MISMO. El bloque del zapato está copiado
  literalmente del archivo 16:9, entre sus marcas INICIO OBJETO y FIN OBJETO, y
  lo único que cambia acá es el `transform` que lo reencuadra, a 0,833.

  LA ANIMACIÓN ES DECLARATIVA (SMIL) porque adentro de un <img> el JavaScript no
  corre, y los dos bucles cierran idénticos a su inicio porque el creativo se ve
  por primera vez a 3,25 s de su propia animación: las dos cosas están medidas
  en la T-02.
--><svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="KOVRIN — Built for the long way.">

  <style>
    .t { font-family: 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif; }
    .b { font-weight: 700; }
  </style>

  <defs>

    <linearGradient id="fondo" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#12151c"/>
      <stop offset="0.55" stop-color="#0c0f15"/>
      <stop offset="1" stop-color="#080a0f"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7a3c" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#ff7a3c" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ff7a3c" stop-opacity="0"/>
    </radialGradient>

    <!-- La capellada: tela, así que el gradiente es corto y sin brillo duro. -->
    <linearGradient id="capellada" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#5a657a"/>
      <stop offset="0.35" stop-color="#3c4454"/>
      <stop offset="1" stop-color="#22262f"/>
    </linearGradient>

    <!-- La mediasuela: espuma, la única superficie clara del zapato. -->
    <linearGradient id="mediasuela" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#f6f1ec"/>
      <stop offset="0.45" stop-color="#dcd6d2"/>
      <stop offset="1" stop-color="#a8b0bd"/>
    </linearGradient>

    <linearGradient id="suela" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242a34"/>
      <stop offset="1" stop-color="#12151c"/>
    </linearGradient>

    <linearGradient id="contrafuerte" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#ff9a63"/>
      <stop offset="1" stop-color="#e05a1e"/>
    </linearGradient>

    <!-- La celda del suelo: 90 px de período, repetida catorce veces. -->
    <g id="celdaSuelo">
      <path d="M2,10 L20,0 L28,3 L10,13 Z" fill="#8b8f98" opacity="0.34"/>
      <path d="M32,10 L50,0 L58,3 L40,13 Z" fill="#8b8f98" opacity="0.26"/>
      <path d="M62,10 L80,0 L88,3 L70,13 Z" fill="#ff7a3c" opacity="0.28"/>
      <path d="M16,30 L34,20 L42,23 L24,33 Z" fill="#8b8f98" opacity="0.2"/>
      <path d="M50,32 L68,22 L76,25 L58,35 Z" fill="#8b8f98" opacity="0.14"/>
      <circle cx="46" cy="16" r="3" fill="#b9c2d0" opacity="0.22"/>
      <circle cx="84" cy="28" r="2" fill="#b9c2d0" opacity="0.16"/>
    </g>

    <clipPath id="ventanaSuelo">
      <rect x="1000" y="774" width="720" height="58"/>
    </clipPath>
  

    <!-- La L: la unión de la columna izquierda y la banda inferior. -->
    <clipPath id="ele">
      <rect x="0" y="0" width="480" height="1080"/>
      <rect x="0" y="810" width="1920" height="270"/>
    </clipPath>
    <!-- La ventana del suelo que baja por la columna. -->
    <clipPath id="columnaSuelo">
      <rect x="386" y="270" width="52" height="500"/>
    </clipPath>
    <!-- La ventana del suelo que corre por la banda. -->
    <clipPath id="ventanaSueloBanda">
      <rect x="560" y="1040" width="1360" height="40"/>
    </clipPath>
  </defs>

  <g clip-path="url(#ele)">
    <rect x="0" y="0" width="1920" height="1080" fill="url(#fondo)"/>

    <ellipse cx="1420" cy="950" rx="560" ry="260" fill="url(#halo)"/>

    <!-- ===================== la marca, arriba de la columna ============= -->
    <text class="t b" x="40" y="120" font-size="64" letter-spacing="4" fill="#f5f3f0">KOVRIN</text>
    <text class="t" x="42" y="164" font-size="19" letter-spacing="5" fill="#ff7a3c">BUILT FOR THE LONG WAY</text>
    <rect x="40" y="196" width="190" height="4" fill="#ff7a3c" opacity="0.9"/>

    <!-- curvas de nivel, quietas, que es lo que el 16:9 pone de fondo -->
    <g fill="none" stroke="#ff7a3c" opacity="0.08" stroke-width="2">
      <path d="M0,430 C90,398 170,412 250,380 C310,356 360,362 480,334"/>
      <path d="M0,560 C100,526 180,542 260,508 C320,482 380,490 480,458"/>
      <path d="M0,690 C90,658 180,672 256,640 C320,612 390,620 480,588"/>
    </g>

    <!-- ===================== el suelo que baja por la columna =========== -->
    <!-- El mismo patrón del 16:9, girado 90°: en el espacio girado el
         desplazamiento de -90 en x es +90 en y de pantalla, o sea hacia abajo. -->
    <g clip-path="url(#columnaSuelo)" opacity="0.5">
      <g transform="translate(436,270) rotate(90)">
        <g transform="matrix(1 0 0 1 -45 0)">
          
          <use href="#celdaSuelo" x="-90"/>
          <use href="#celdaSuelo" x="0"/>
          <use href="#celdaSuelo" x="90"/>
          <use href="#celdaSuelo" x="180"/>
          <use href="#celdaSuelo" x="270"/>
          <use href="#celdaSuelo" x="360"/>
          <use href="#celdaSuelo" x="450"/>
          <use href="#celdaSuelo" x="540"/>
        </g>
      </g>
    </g>

    <!-- ===================== el texto, en la banda ====================== -->
    <text class="t" x="540" y="898" font-size="42" letter-spacing="0.5" fill="#c9ccd3">Trail cushioning. 240 grams.</text>
    <text class="t" x="540" y="956" font-size="25" letter-spacing="4" fill="#8b8f98">THREE TERRAINS, ONE OUTSOLE</text>

    <!-- ===================== el suelo que corre por la banda ============ -->
    <g clip-path="url(#ventanaSueloBanda)" opacity="0.5">
      <g transform="matrix(1 0 0 1 515 1042)">
        
        <use href="#celdaSuelo" x="-90"/>
        <use href="#celdaSuelo" x="0"/>
        <use href="#celdaSuelo" x="90"/>
        <use href="#celdaSuelo" x="180"/>
        <use href="#celdaSuelo" x="270"/>
        <use href="#celdaSuelo" x="360"/>
        <use href="#celdaSuelo" x="450"/>
        <use href="#celdaSuelo" x="540"/>
        <use href="#celdaSuelo" x="630"/>
        <use href="#celdaSuelo" x="720"/>
        <use href="#celdaSuelo" x="810"/>
        <use href="#celdaSuelo" x="900"/>
        <use href="#celdaSuelo" x="990"/>
        <use href="#celdaSuelo" x="1080"/>
        <use href="#celdaSuelo" x="1170"/>
        <use href="#celdaSuelo" x="1260"/>
        <use href="#celdaSuelo" x="1350"/>
        <use href="#celdaSuelo" x="1440"/>
      </g>
    </g>

    <!-- el polvo, el mismo ciclo de 6 s del 16:9 -->
    <g fill="#b9c2d0">
      <g opacity="0.18" transform="matrix(1 0 0 1 -17 -7)">
        
        
        <ellipse cx="1210" cy="1016" rx="46" ry="15"/>
        <ellipse cx="1156" cy="992" rx="30" ry="11"/>
        <ellipse cx="1118" cy="1018" rx="19" ry="8"/>
        <circle cx="1186" cy="960" r="7"/>
      </g>
    </g>

    <!-- sombra de apoyo -->
    <ellipse cx="1480" cy="1036" rx="300" ry="20" fill="#000000" opacity="0.5"/>

    <!-- ===================== el objeto, en la banda ===================== -->
    <!-- El zapato del 16:9, a 0,833: 240 px de zapato por 0,833 son 200, que es
         lo que entra en los 270 de la banda dejando aire arriba y abajo. -->
    <g transform="translate(357,394) scale(0.833)">

  <!-- ===================== el zapato ===================== -->
  <!-- Espacio local: origen en el talón, suelo en y 206, punta en x 514. -->
  <g transform="translate(1000,482) scale(1.35)">

    <!-- capellada: la silueta entera, de la boca a la mediasuela -->
    <path fill="url(#capellada)" d="M28,66              C14,90 8,126 16,158              C22,188 42,204 72,206              L392,206              C450,205 492,186 514,150              C521,138 513,126 499,130              C464,141 430,139 400,129              C362,116 332,100 302,86              C300,68 294,54 282,46              L258,54              C230,96 132,96 92,58              L58,50              C40,52 32,56 28,66 Z"/>

    <!-- la boca: una lente oscura, no un borde recto -->
    <path fill="#0f1218" opacity="0.92" d="M258,54 C230,96 132,96 92,58 C118,132 232,126 258,54 Z"/>

    <path fill="none" stroke="#7b8699" stroke-width="3" opacity="0.7" d="M258,54 C230,96 132,96 92,58"/>

    <!-- la lengüeta, que asoma por delante de la boca -->
    <path fill="#39414f" d="M258,54 C272,50 278,48 282,46 C292,58 300,74 302,90 L282,100              C278,84 270,68 258,54 Z"/>

    <!-- contrafuerte del talón: el acento entra por acá y no por un emblema -->
    <path fill="url(#contrafuerte)" d="M28,66 C14,90 8,126 16,158 L44,160 C38,126 42,96 56,72 Z"/>

    <!-- las dos cintas del cerco lateral: refuerzo, no logotipo -->
    <path fill="#ff7a3c" opacity="0.95" d="M150,172 L180,88 L208,84 L184,174 Z"/>
    <path fill="#ff7a3c" opacity="0.8" d="M226,166 L258,80 L284,76 L258,166 Z"/>

    <!-- el empeine: primero el panel oscuro del cierre, después los cordones
         encima. Sin el panel los cordones flotan sobre la tela y se leen como
         rayas y no como un cierre. -->
    <path fill="#1b2029" opacity="0.85" d="M300,90 C330,102 362,116 398,130 L386,160              C350,146 318,132 292,118 Z"/>
    <g stroke="#f2ece6" stroke-width="6" stroke-linecap="round" opacity="0.9">
      <path d="M302,98 L318,124"/>
      <path d="M326,108 L342,134"/>
      <path d="M350,118 L366,144"/>
      <path d="M374,128 L390,154"/>
    </g>
    <g fill="#b9c2d0" opacity="0.85">
      <circle cx="304" cy="96" r="3.5"/>
      <circle cx="328" cy="106" r="3.5"/>
      <circle cx="352" cy="116" r="3.5"/>
      <circle cx="376" cy="126" r="3.5"/>
    </g>

    <!-- la puntera, en la misma tela pero más clara -->
    <path fill="#4c5566" opacity="0.85" d="M430,140 C462,144 486,140 508,130 C516,127 521,138 514,150              C496,180 462,198 420,203 C428,182 430,160 430,140 Z"/>

    <!-- mediasuela: la cuña. 50 px en el talón, 31 en el antepié -->
    <path fill="url(#mediasuela)" d="M16,156              C22,188 42,204 72,206              L392,206              C450,205 492,186 514,150              C519,142 514,132 506,134              C476,160 436,174 390,175              L94,175              C56,174 28,170 16,156 Z"/>
    <!-- la línea de compresión de la espuma -->
    <path fill="none" stroke="#8b8f98" stroke-width="2" opacity="0.5" d="M24,180 C60,192 120,196 200,196 L392,195 C440,194 478,182 504,160"/>

    <!-- suela: la banda más oscura, y los tacos colgando -->
    <path fill="url(#suela)" d="M18,178              C24,192 44,204 72,206              L392,206              C450,205 492,186 514,150              C518,144 514,138 507,141              C480,168 438,190 390,191              L92,191              C58,190 32,186 18,178 Z"/>
    <g fill="#12151c">
      <rect x="74" y="203" width="22" height="14" rx="5"/>
      <rect x="110" y="203" width="22" height="14" rx="5"/>
      <rect x="146" y="203" width="22" height="14" rx="5"/>
      <rect x="182" y="203" width="22" height="14" rx="5"/>
      <rect x="218" y="203" width="22" height="14" rx="5"/>
      <rect x="254" y="203" width="22" height="14" rx="5"/>
      <rect x="290" y="203" width="22" height="14" rx="5"/>
      <rect x="326" y="203" width="22" height="14" rx="5"/>
      <rect x="362" y="203" width="22" height="14" rx="5"/>
      <rect x="398" y="200" width="22" height="14" rx="5" transform="rotate(-6 409 207)"/>
      <rect x="434" y="192" width="22" height="14" rx="5" transform="rotate(-16 445 199)"/>
      <rect x="468" y="178" width="20" height="13" rx="5" transform="rotate(-28 478 184)"/>
    </g>
  </g>
    </g>

    <!-- ===================== el filo interno de la L ==================== -->
    <rect x="474" y="0" width="6" height="816" fill="#ff7a3c"/>
    <rect x="480" y="810" width="1440" height="6" fill="#ff7a3c"/>
  </g>
</svg>
