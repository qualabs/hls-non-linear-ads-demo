<!--
  THE SAME LOGO, WITH THE WORDMARK IN WHITE. Derived from `logo-qualabs.svg` in
  this folder, which is the vendored brand copy and is not edited: the seven
  paths of the wordmark, three of them `#383838` and four of them `#64ba93`,
  carry `#fff` here. Nothing else changes, so the mark keeps its four inks.

  WHY IT EXISTS: this page is dark, the wordmark of the brand file is ink
  `#383838` on it, and the logo was being set on a white plate to be readable.
  Nicolas asked for the plate gone, twice, and for white letters instead. What
  changes to suit the surface is the logo and not the page.

  IT IS FOR A DARK SURFACE AND ONLY FOR ONE. On paper, or on any light page,
  this file is invisible and `logo-qualabs.svg` is the one to use.

  AND NOTHING IN THIS COMMENT IS TWO HYPHENS IN A ROW, which is not a style rule:
  an SVG is XML, a comment carrying that sequence makes the document ill formed,
  and the browser then draws the alt text where the logo should be. Which is what
  it did, in the first version of this file.
-->
